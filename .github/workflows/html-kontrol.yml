name: HTML Kontrolü

on:
  pull_request:
    branches: [main]

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: .qmd ve .html Eşleşme Kontrolü
        run: |
          echo "📂 .qmd dosyaları kontrol ediliyor..."
          HATA=0
          for qmd in $(find 2026-guz -name "*.qmd" -type f); do
            html="${qmd%.qmd}.html"
            if [ ! -f "$html" ]; then
              echo "❌ HATA: $qmd için HTML yok!"
              echo "   Beklenen: $html"
              echo "   Çözüm: quarto render $qmd"
              HATA=1
            else
              echo "✅ $qmd → HTML var"
            fi
          done
          if [ $HATA -eq 1 ]; then
            echo ""
            echo "🚫 PR REDDEDİLDİ: Bazı .qmd dosyalarının HTML çıktısı yok."
            exit 1
          fi
          echo ""
          echo "🎉 Tüm .qmd dosyaları için HTML mevcut."
