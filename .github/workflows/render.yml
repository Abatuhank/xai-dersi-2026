name: Quarto Render & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Inline R Kodlarını Temizle
        run: |
          find . -name "*.qmd" -exec sed -i -E 's/`r [^`]+`//g' {} \;

      - name: R Kur
        uses: r-lib/actions/setup-r@v2

      - name: R Paketlerini Kur
        run: |
          install.packages(c("knitr", "rmarkdown"))
        shell: Rscript {0}

      - name: Quarto Kur
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Et
        run: quarto render --no-execute

      - name: Pages Ayarlarını Yap
        uses: actions/configure-pages@v4

      - name: Site Dosyalarını Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e Deploy Et
        id: deployment
        uses: actions/deploy-pages@v4
